# System Design Atlas - Problem Manifest
# 100 system design problems across 10 categories

problems:
  # ============================================================================
  # I. Foundational Infrastructure & Core Services (10 problems)
  # ============================================================================
  - slug: "distributed-unique-id-generator"
    title: "Distributed Unique ID Generator"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a Snowflake-like service with time-ordering guarantees, clock skew protection, and multi-region failure modes."

  - slug: "global-rate-limiter"
    title: "Global Rate Limiter"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a rate limiter (per user/IP/API key) that works across extensive geographic regions with low coordination overhead and latency."

  - slug: "url-shortener"
    title: "URL Shortener & Link Management"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a system handling custom aliases, aggressive expiration policies, abuse prevention, and global low-latency reads."

  - slug: "distributed-lock-service"
    title: "Distributed Lock Service"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a coordination service (like Chubby/ZooKeeper) focusing on lease management, fencing tokens, and client failure detection."

  - slug: "task-scheduler-batch"
    title: "Task Scheduler (Batch)"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a distributed job scheduler supporting priority queues, delayed execution, retries, and multi-tenant isolation."

  - slug: "workflow-orchestration-engine"
    title: "Workflow Orchestration Engine"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a system (like Airflow/Temporal) capable of managing long-running processes with durable state and exactly-once step execution."

  - slug: "configuration-distribution-system"
    title: "Configuration Distribution System"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a high-availability configuration store that supports push/pull updates, schema validation, versioning, and safe rollbacks across a fleet."

  - slug: "feature-flag-management"
    title: "Feature Flag Management"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a platform for targeting, percentage-based rollouts, A/B experimentation, and emergency kill switches with near-zero latency."

  - slug: "service-discovery"
    title: "Service Discovery"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a system for multi-cluster environments (e.g., Kubernetes) with health-based routing and eventual consistency handling."

  - slug: "secrets-management-service"
    title: "Secrets Management Service"
    category: "Foundational Infrastructure"
    category_dir: "01-foundational-infrastructure"
    description: "Design a vault (like HashiCorp Vault) handling rotation, audit logs, HSM integration, and envelope encryption."

  # ============================================================================
  # II. Storage, Caching, and Data Platforms (10 problems)
  # ============================================================================
  - slug: "multi-tenant-object-storage"
    title: "Multi-Tenant Object Storage"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design an S3-compatible service supporting versioning, lifecycle rules, erasure coding, and cross-region replication."

  - slug: "distributed-key-value-store"
    title: "Distributed Key-Value Store"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a Dynamo-style store with tunable consistency, partitioning, and conflict resolution (vector clocks/LWW)."

  - slug: "global-distributed-cache"
    title: "Global Distributed Cache"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a Redis-like service with cluster awareness, eviction policies, and handling/preventing thundering herds."

  - slug: "time-series-database"
    title: "Time-Series Database"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a storage engine for IoT telemetry or metrics with high write throughput, downsampling rollups, and retention tiers."

  - slug: "sql-database-as-a-service"
    title: "SQL Database-as-a-Service"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design the control plane for provisioning sharded SQL databases, handling high availability, automated backups, and point-in-time restores."

  - slug: "distributed-file-system-ml"
    title: "Distributed File System for AI/ML"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a storage system optimized for high-throughput parallel reads (for training) rather than standard POSIX compliance."

  - slug: "data-lake-architecture"
    title: "Data Lake Architecture"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a system supporting table formats (Iceberg/Hudi), partition compaction, and governance over raw object storage."

  - slug: "change-data-capture-platform"
    title: "Change Data Capture (CDC) Platform"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a pipeline to stream changes from OLTP databases to data warehouses with ordering guarantees."

  - slug: "ledger-database"
    title: "Ledger Database"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design an immutable, append-only banking ledger with cryptographic verification and double-entry accounting enforcement."

  - slug: "vector-database"
    title: "Vector Database"
    category: "Storage & Data Platforms"
    category_dir: "02-storage-data-platforms"
    description: "Design a specialized store for high-dimensional embeddings supporting approximate nearest neighbor (ANN) search and filtering."

  # ============================================================================
  # III. Observability & Reliability Engineering (10 problems)
  # ============================================================================
  - slug: "distributed-tracing-system"
    title: "Distributed Tracing System"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design an OpenTelemetry backend handling sampling strategies (head-based vs tail-based), decision making, and cost controls."

  - slug: "high-cardinality-metrics-pipeline"
    title: "High-Cardinality Metrics Pipeline"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a system (like Prometheus/Cortex) to ingest and query metrics at scale, handling cardinality explosions and long-term storage."

  - slug: "centralized-logging-platform"
    title: "Centralized Logging Platform"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a log aggregator with schema evolution, PII redaction/masking, and fast text search capabilities."

  - slug: "alerting-incident-routing"
    title: "Alerting & Incident Routing"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a platform for deduplication, silence rules, escalation policies, and SLO-based alerting."

  - slug: "slo-error-budget-monitoring"
    title: "SLO/Error Budget Monitoring"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a system to track burn rates across multiple time windows and trigger alerts based on remaining error budgets."

  - slug: "chaos-engineering-platform"
    title: "Chaos Engineering Platform"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a controlled fault-injection system that limits blast radius and automatically halts experiments upon health signal degradation."

  - slug: "multi-region-disaster-recovery"
    title: "Multi-Region Disaster Recovery"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design the failover strategy for a tier-1 service, defining RTO/RPO targets, data replication lag, and DNS cutover automation."

  - slug: "capacity-planning-autoscaling"
    title: "Capacity Planning & Autoscaling"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a predictive autoscaler that uses historical signals and safety margins to provision compute resources ahead of demand."

  - slug: "deployment-system"
    title: "Deployment System (Blue/Green/Canary)"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design an orchestration engine for safe deployments with automated metric analysis and rollback criteria."

  - slug: "ddos-protection-system"
    title: "DDoS Protection System"
    category: "Observability & Reliability"
    category_dir: "03-observability-reliability"
    description: "Design a scrubbing pipeline with traffic analysis, pattern detection, and adaptive challenge mechanisms (CAPTCHAs/PoW)."

  # ============================================================================
  # IV. Real-Time Interactions & Media (10 problems)
  # ============================================================================
  - slug: "real-time-presence-service"
    title: "Real-Time Presence Service"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a system to track Online/Last Seen status for millions of concurrent users with minimal write amplification."

  - slug: "push-notification-broker"
    title: "Push Notification Broker"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a delivery service handling millions of notifications per second, with prioritization, rate limiting, and delivery receipts."

  - slug: "chat-system"
    title: "Chat System (1:1 & Group)"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a messaging platform supporting offline sync, read receipts, typing indicators, and fan-out for large groups."

  - slug: "e2e-encrypted-messaging"
    title: "End-to-End Encrypted Messaging"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design the key management and exchange protocol (Signal protocol style) supporting multi-device synchronization and forward secrecy."

  - slug: "live-audio-rooms"
    title: "Live Audio Rooms"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a Clubhouse/Twitter Spaces clone focusing on audio mixing, moderation interaction, and scalable fan-out to listeners."

  - slug: "live-video-streaming"
    title: "Live Video Streaming"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a Twitch-like platform handling ingest (RTMP), transcoding ladders, low-latency delivery (HLS/DASH), and DVR playback."

  - slug: "video-on-demand"
    title: "Video-on-Demand (Netflix-like)"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a global streaming architecture with adaptive bitrate, CDN placement, DRM strategies, and resumed playback state."

  - slug: "multiplayer-game-backend"
    title: "Multiplayer Game Backend"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a state synchronization engine using UDP, handling lag compensation, authoritative server state, and matchmaking."

  - slug: "leaderboard-system"
    title: "Leaderboard System"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a real-time ranking system for millions of players, supporting various time windows (daily/weekly) and rapid updates."

  - slug: "collaborative-document-editing"
    title: "Collaborative Document Editing"
    category: "Real-Time & Media"
    category_dir: "04-realtime-media"
    description: "Design a system (like Google Docs) using Operational Transformation (OT) or CRDTs to handle concurrent edits and offline reconciliation."

  # ============================================================================
  # V. Social, Search, & Discovery (10 problems)
  # ============================================================================
  - slug: "social-news-feed"
    title: "Social News Feed"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a feed generation system balancing pull vs. push models (fan-out-on-write vs. read) based on user activity levels."

  - slug: "stories-product"
    title: "Stories Product"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design an ephemeral content system with 24-hour expiration, viewer lists, and privacy controls."

  - slug: "distributed-counter-service"
    title: "Distributed Counter Service"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a Likes/Views counting service that handles massive write contention with eventual consistency and aggregation accuracy."

  - slug: "comment-system"
    title: "Comment System"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a threaded discussion platform supporting deep nesting, pagination, moderation, and anti-spam filtering."

  - slug: "search-autocomplete"
    title: "Search Autocomplete"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a typeahead service focusing on trie structures, personalization, caching, and sub-100ms latency."

  - slug: "general-purpose-search-engine"
    title: "General Purpose Search Engine"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design the indexing pipeline (crawler -> tokenizer -> indexer) and ranker for a large-scale document corpus."

  - slug: "geospatial-nearby-search"
    title: "Geospatial Nearby Search"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a service to find points of interest (restaurants/drivers) using Geohashes or Quadtrees, handling frequent location updates."

  - slug: "recommendation-system-infrastructure"
    title: "Recommendation System Infrastructure"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design the pipeline for candidate generation, scoring, and ranking, including feedback loops for model retraining."

  - slug: "graph-relationship-service"
    title: "Graph Relationship Service"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a service to store and query social connections (friends/followers) with bi-directional lookups and heavy caching."

  - slug: "trending-topics-engine"
    title: "Trending Topics Engine"
    category: "Social & Discovery"
    category_dir: "05-social-discovery"
    description: "Design a stream processing system to identify surging keywords in real-time using sliding windows and heavy-hitter algorithms."

