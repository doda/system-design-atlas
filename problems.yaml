  - slug: "high-frequency-trading-gateway"
    title: "High-Frequency Trading Gateway"
    category: "Commerce & Fintech"
    category_dir: "06-commerce-fintech"
    description: "Design an order entry gateway focusing on microsecond latency, risk checks, and deterministic execution."

